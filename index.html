<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>嘉駿振凱的英文小遊戲</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI','微軟正黑體',sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;
}
.screen{display:none}
.screen.active{display:block;width:100%}
.card{
  background:#fff;border-radius:24px;padding:28px 24px;
  max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:0 auto;
}

/* Menu */
.menu-title{text-align:center;margin-bottom:2px}
.menu-title h1{font-size:1.4rem;color:#3d3d6b;font-weight:800;line-height:1.3}
.menu-title p{color:#999;font-size:.82rem;margin-top:4px}
.name-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:4px}
.name-btn{
  border:2.5px solid #e8e8f0;background:#fff;border-radius:18px;
  padding:18px 10px 14px;cursor:pointer;transition:.18s;text-align:center;
  position:relative;overflow:hidden;
}
.name-btn:hover{border-color:#667eea;background:#f4f4ff;transform:translateY(-2px)}
.name-btn.selected{
  border-color:transparent;
  background:linear-gradient(135deg,#667eea,#764ba2);
  box-shadow:0 8px 20px rgba(102,126,234,.35);transform:translateY(-2px);
}
.name-btn .nb-avatar{font-size:2.6rem;display:block;margin-bottom:6px;line-height:1}
.name-btn .nb-name{font-size:1.1rem;font-weight:800;color:#3d3d6b}
.name-btn.selected .nb-name{color:#fff}
.name-btn .nb-sub{font-size:.7rem;color:#bbb;margin-top:2px}
.name-btn.selected .nb-sub{color:rgba(255,255,255,.75)}
.section-label{font-size:.78rem;font-weight:700;color:#bbb;text-transform:uppercase;
  letter-spacing:.07em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.section-label span{flex:1;height:1px;background:#f0f0f0}
.grade-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sel-btn{
  border:2px solid #e8e8f0;background:#fff;border-radius:12px;
  padding:11px 4px;font-size:.95rem;font-weight:700;color:#4a4a6a;
  cursor:pointer;transition:.15s;text-align:center;position:relative;
}
.sel-btn small{display:block;font-size:.62rem;font-weight:400;color:#bbb;margin-top:1px}
.sel-btn:hover{border-color:#667eea;background:#f4f4ff}
.sel-btn.selected{border-color:#667eea;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.sel-btn.selected small{color:rgba(255,255,255,.7)}
.weak-dot{position:absolute;top:5px;right:6px;width:7px;height:7px;
  border-radius:50%;background:#ff6b6b;display:none}
.has-weak .weak-dot{display:block}
.exam-grid,.count-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick-btn{
  border:2px solid #e8e8f0;background:#fff;border-radius:14px;
  padding:15px 12px;cursor:pointer;transition:.15s;text-align:center;
}
.pick-btn:hover{border-color:#667eea;background:#f4f4ff}
.pick-btn.selected{border-color:#667eea;background:linear-gradient(135deg,#667eea,#764ba2)}
.pick-btn .pi{font-size:1.5rem;display:block;margin-bottom:5px}
.pick-btn .pn{font-size:.95rem;font-weight:700;color:#3d3d6b}
.pick-btn .ps{font-size:.7rem;color:#bbb;margin-top:2px}
.pick-btn.selected .pn,.pick-btn.selected .ps{color:#fff}
.pick-btn.selected .ps{opacity:.8}
.alert-bar{
  background:#fff8e1;border:1px solid #ffe082;border-radius:10px;
  padding:9px 13px;font-size:.78rem;color:#795548;margin-top:9px;
  display:none;gap:6px;align-items:flex-start;line-height:1.5;
}
.alert-bar.show{display:flex}
.start-btn{
  width:100%;margin-top:20px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;border:none;border-radius:14px;
  padding:15px;font-size:1.05rem;font-weight:700;
  cursor:pointer;transition:.15s;opacity:.3;pointer-events:none;
}
.start-btn.ready{opacity:1;pointer-events:auto}
.start-btn.ready:hover{opacity:.9;transform:scale(1.01)}

/* Quiz */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.quiz-meta{font-size:.82rem;color:#bbb;font-weight:600}
.quiz-score{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;border-radius:999px;padding:5px 15px;font-weight:700;font-size:.88rem;
}
.prog-wrap{margin-bottom:14px}
.cd-wrap{margin-bottom:14px}
.cd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.cd-label{font-size:.72rem;color:#bbb;font-weight:600}
.cd-num{
  font-size:.95rem;font-weight:800;color:#3d3d6b;
  min-width:26px;text-align:right;transition:color .3s;
}
.cd-num.warn{color:#e65100}
.cd-num.urgent{color:#e53935}
@keyframes cdpulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.cd-num.urgent{animation:cdpulse .5s ease infinite}
.cd-track{background:#eee;border-radius:999px;height:9px;overflow:hidden}
.cd-bar{height:100%;border-radius:999px;width:100%;background:#43e97b;transition:background .4s}
.prog-track{background:#eee;border-radius:999px;height:7px;overflow:hidden;margin-bottom:5px}
.prog-fill{height:100%;border-radius:999px;transition:width .35s;
  background:linear-gradient(90deg,#43e97b,#667eea,#f6d365,#fd9853,#ff6b6b)}
.prog-zones{display:flex;font-size:.65rem;color:#bbb;justify-content:space-between;padding:0 2px}
.badge-row{display:flex;align-items:center;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.type-badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.73rem;font-weight:700}
.type-reading{background:#fff3cd;color:#856404}
.type-listening{background:#e8d5f5;color:#6f42c1}
.diff-badge{border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700}
.diff-0{background:#e8f5e9;color:#2e7d32}
.diff-1{background:#e3f2fd;color:#1565c0}
.diff-2{background:#fff8e1;color:#e65100}
.diff-3{background:#fce4ec;color:#c62828}
.diff-4{background:#fce4ec;color:#b71c1c}
.weak-badge{background:#fff0f0;color:#c0392b;border-radius:999px;
  padding:3px 10px;font-size:.7rem;font-weight:700;display:none}
.weak-badge.show{display:inline-block}
.question-box{
  background:#f8f9ff;border-radius:16px;padding:20px;text-align:center;
  margin-bottom:17px;min-height:85px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.q-label{color:#ccc;font-size:.8rem}
.q-word{font-size:1.85rem;font-weight:800;color:#3d3d6b}
.speak-btn{
  background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;
  border-radius:999px;padding:8px 20px;font-size:.88rem;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.speak-btn:hover{opacity:.9;transform:scale(1.03)}
.speak-btn.playing{opacity:.4;pointer-events:none}
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.opt-btn{
  border:2px solid #e8e8f0;background:#fff;border-radius:13px;
  padding:13px 9px;font-size:.88rem;font-weight:600;color:#3d3d6b;
  cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px;
  word-break:break-word;
}
.opt-btn:hover:not(:disabled){border-color:#667eea;background:#f4f4ff;transform:scale(1.02)}
.opt-btn:disabled{cursor:default}
.opt-lbl{
  background:#667eea;color:#fff;border-radius:7px;
  min-width:24px;height:24px;display:flex;align-items:center;
  justify-content:center;font-size:.75rem;flex-shrink:0;
}
.opt-btn.correct{border-color:#28a745;background:#d4edda}
.opt-btn.correct .opt-lbl{background:#28a745}
.opt-btn.wrong{border-color:#dc3545;background:#f8d7da}
.opt-btn.wrong .opt-lbl{background:#dc3545}
.opt-btn.reveal{border-color:#28a745;background:#d4edda}
.opt-btn.reveal .opt-lbl{background:#28a745}
.feedback{
  border-radius:11px;padding:11px 15px;font-weight:600;font-size:.88rem;
  margin-bottom:13px;display:none;
}
.feedback.correct{background:#d4edda;color:#155724;display:block}
.feedback.wrong{background:#f8d7da;color:#721c24;display:block}
.next-btn{
  width:100%;background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;border:none;border-radius:13px;padding:14px;
  font-size:.98rem;font-weight:700;cursor:pointer;display:none;transition:.15s;
}
.next-btn.visible{display:block}
.next-btn:hover{opacity:.9}

/* Result */
.result-header{text-align:center;margin-bottom:18px}
.score-circle{
  width:115px;height:115px;border-radius:50%;margin:0 auto 13px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 8px 24px rgba(102,126,234,.4);
}
.sc-num{font-size:2rem;font-weight:800;line-height:1}
.sc-max{font-size:.75rem;opacity:.8}
.result-header h2{font-size:1.25rem;color:#3d3d6b;font-weight:800;margin-bottom:3px}
.result-header p{color:#999;font-size:.82rem}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:#f8f9ff;border-radius:13px;padding:12px;text-align:center}
.stat-num{font-size:1.35rem;font-weight:800;color:#3d3d6b}
.stat-lbl{font-size:.73rem;color:#bbb;margin-top:2px}
.r-section{margin-bottom:16px}
.r-section h3{font-size:.85rem;font-weight:700;color:#3d3d6b;margin-bottom:8px;
  display:flex;align-items:center;gap:7px}
.r-section h3 .badge{font-size:.7rem;background:#f0f0ff;color:#667eea;
  border-radius:999px;padding:2px 9px;font-weight:600}
.wrong-item{
  background:#f8f9ff;border-radius:11px;padding:9px 13px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:7px;font-size:.82rem;gap:8px;
}
.wi-q{color:#999;flex-shrink:0}
.wi-a{color:#28a745;font-weight:700;text-align:right}
.weak-tags{display:flex;flex-wrap:wrap;gap:7px}
.weak-tag{
  background:#fff0f0;border:1px solid #ffd6d6;border-radius:8px;
  padding:5px 11px;font-size:.78rem;color:#c0392b;font-weight:600;
  display:flex;align-items:center;gap:5px;
}
.wt-cnt{
  background:#c0392b;color:#fff;border-radius:999px;
  width:16px;height:16px;display:flex;align-items:center;
  justify-content:center;font-size:.62rem;flex-shrink:0;
}
.r-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sec{background:#f0f0ff;color:#667eea;border:none;border-radius:13px;
  padding:13px;font-size:.92rem;font-weight:700;cursor:pointer;transition:.15s;}
.btn-sec:hover{background:#e0e0ff}
.btn-pri{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
  border:none;border-radius:13px;padding:13px;font-size:.92rem;font-weight:700;
  cursor:pointer;transition:.15s;}
.btn-pri:hover{opacity:.9}

/* Player avatar photo on menu */
.name-btn .nb-photo{
  width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top center;
  display:block;margin:0 auto 6px;border:3px solid #e8e8f0;
}
.name-btn.selected .nb-photo{border-color:rgba(255,255,255,.5)}

/* Weak words review panel on menu */
.weak-review-btn{
  width:100%;margin-top:12px;background:none;border:1.5px solid #ff6b6b;
  border-radius:12px;padding:10px;font-size:.82rem;font-weight:700;
  color:#ff6b6b;cursor:pointer;transition:.15s;display:none;
}
.weak-review-btn:hover{background:#fff5f5;border-color:#e53935}
.weak-review-btn.show{display:block}
.weak-panel{display:none;margin-top:10px}
.weak-panel.show{display:block}
.weak-panel-title{font-size:.85rem;font-weight:800;color:#e53935;margin-bottom:8px}
.weak-panel-list{max-height:260px;overflow-y:auto}
.weak-word-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid #f0f0f0;font-size:.82rem;cursor:pointer;transition:.1s;
}
.weak-word-item:hover{background:#fff5f5}
.weak-word-item:last-child{border-bottom:none}
.weak-word-en{font-weight:700;color:#3d3d6b;min-width:80px}
.weak-word-zh{color:#999;flex:1}
.weak-word-cnt{background:#ff6b6b;color:#fff;border-radius:999px;padding:2px 8px;font-size:.65rem;font-weight:700}
.weak-panel-empty{color:#ccc;font-size:.82rem;text-align:center;padding:16px 0}
.weak-panel-grade{margin-bottom:10px}
.weak-panel-grade-title{font-size:.78rem;font-weight:700;color:#667eea;margin-bottom:4px}

/* Leaderboard rank 4-10 */
.lb-row.rank-other{background:#f8f9ff;border:1px solid #eee}
.lb-rank-num{font-size:.88rem;font-weight:800;color:#999;min-width:28px;text-align:center}
.lb-time{font-size:.62rem;color:#bbb;margin-top:1px}

/* Confetti */
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.cf{position:fixed;width:10px;height:14px;border-radius:3px;animation:fall linear forwards;pointer-events:none;z-index:999}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .28s ease forwards}

/* ── Leaderboard & History ── */
.lb-section{margin-top:20px;border-top:2px solid #f0f0f0;padding-top:16px}
.lb-title{font-size:.95rem;font-weight:800;color:#3d3d6b;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.lb-today-count{font-size:.75rem;color:#999;font-weight:600;margin-left:auto}
.lb-empty{color:#ccc;font-size:.82rem;text-align:center;padding:16px 0}
.lb-podium{display:flex;flex-direction:column;gap:8px}
.lb-row{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:13px;background:#f8f9ff;position:relative;overflow:hidden;
}
.lb-row.rank-1{background:linear-gradient(135deg,#fff8e1,#fff3cd);border:1.5px solid #ffd54f}
.lb-row.rank-2{background:linear-gradient(135deg,#f5f5f5,#eeeeee);border:1.5px solid #ccc}
.lb-row.rank-3{background:linear-gradient(135deg,#fff3e0,#ffe0b2);border:1.5px solid #ffb74d}
.lb-rank{font-size:1.3rem;min-width:28px;text-align:center}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:.88rem;font-weight:700;color:#3d3d6b}
.lb-detail{font-size:.68rem;color:#999;margin-top:1px}
.lb-score-val{font-size:1.1rem;font-weight:800;color:#667eea}
.lb-pct{font-size:.65rem;color:#999}

.hist-toggle{
  width:100%;margin-top:12px;background:none;border:1.5px solid #e8e8f0;
  border-radius:12px;padding:10px;font-size:.82rem;font-weight:700;
  color:#667eea;cursor:pointer;transition:.15s;
}
.hist-toggle:hover{background:#f4f4ff;border-color:#667eea}
.hist-panel{display:none;margin-top:10px}
.hist-panel.show{display:block}
.hist-filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.hist-f-btn{
  border:1.5px solid #e8e8f0;background:#fff;border-radius:8px;
  padding:5px 10px;font-size:.72rem;font-weight:600;color:#666;
  cursor:pointer;transition:.15s;
}
.hist-f-btn:hover{border-color:#667eea;color:#667eea}
.hist-f-btn.active{background:#667eea;color:#fff;border-color:#667eea}
.hist-list{max-height:300px;overflow-y:auto}
.hist-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid #f0f0f0;font-size:.78rem;
}
.hist-item:last-child{border-bottom:none}
.hist-date{color:#999;min-width:70px;font-size:.7rem}
.hist-who{font-weight:700;color:#3d3d6b;min-width:60px}
.hist-grade{color:#667eea;font-weight:600;font-size:.7rem;min-width:45px}
.hist-sc{margin-left:auto;font-weight:800;color:#3d3d6b}
.hist-pct-bar{width:50px;height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-left:6px}
.hist-pct-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#667eea,#764ba2)}
.hist-summary{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;
}
.hist-stat{background:#f8f9ff;border-radius:10px;padding:10px;text-align:center}
.hist-stat-num{font-size:1.1rem;font-weight:800;color:#3d3d6b}
.hist-stat-lbl{font-size:.65rem;color:#999;margin-top:2px}

/* ── Mode selector ── */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.mode-btn{
  border:2.5px solid #e8e8f0;background:#fff;border-radius:18px;
  padding:20px 12px;cursor:pointer;transition:.18s;text-align:center;
}
.mode-btn:hover{border-color:#667eea;background:#f4f4ff;transform:translateY(-2px)}
.mode-btn.selected{
  border-color:transparent;
  background:linear-gradient(135deg,#667eea,#764ba2);
  box-shadow:0 8px 20px rgba(102,126,234,.35);transform:translateY(-2px);
}
.mode-btn .mb-icon{font-size:2.2rem;display:block;margin-bottom:6px}
.mode-btn .mb-title{font-size:1rem;font-weight:800;color:#3d3d6b}
.mode-btn.selected .mb-title{color:#fff}
.mode-btn .mb-sub{font-size:.7rem;color:#bbb;margin-top:2px}
.mode-btn.selected .mb-sub{color:rgba(255,255,255,.75)}
.quiz-options{display:none}
.quiz-options.show{display:block}

/* ── Study screen ── */
.study-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.study-title{font-size:1rem;font-weight:800;color:#3d3d6b}
.study-count{font-size:.78rem;color:#999}
.study-card{
  background:#f8f9ff;border-radius:18px;padding:28px 20px;text-align:center;
  margin-bottom:14px;min-height:160px;cursor:pointer;transition:.2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.study-card:hover{transform:scale(1.01);box-shadow:0 4px 16px rgba(102,126,234,.15)}
.study-en{font-size:2rem;font-weight:800;color:#3d3d6b}
.study-zh{font-size:1.3rem;color:#667eea;font-weight:700}
.study-hint{font-size:.72rem;color:#ccc;margin-top:4px}
.study-nav{display:flex;gap:10px}
.study-nav button{flex:1}
.study-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.study-list-item{
  background:#f8f9ff;border-radius:10px;padding:10px;text-align:center;
  cursor:pointer;transition:.15s;border:1.5px solid transparent;
}
.study-list-item:hover{border-color:#667eea;background:#f0f0ff}
.study-list-en{font-size:.92rem;font-weight:700;color:#3d3d6b}
.study-list-zh{font-size:.78rem;color:#999;margin-top:2px}
.study-mode-toggle{display:flex;gap:8px;margin-bottom:12px}
.smt-btn{
  flex:1;border:1.5px solid #e8e8f0;background:#fff;border-radius:10px;
  padding:8px;font-size:.78rem;font-weight:700;color:#666;cursor:pointer;transition:.15s;text-align:center;
}
.smt-btn:hover{border-color:#667eea}
.smt-btn.active{background:#667eea;color:#fff;border-color:#667eea}

/* ── Result leaderboard ── */
.r-lb{margin-top:16px;margin-bottom:16px}

/* ── New question types ── */
.type-emoji{background:#e8f5e9;color:#2e7d32}
.type-match{background:#e3f2fd;color:#1565c0}
.type-spelling{background:#fff3e0;color:#e65100}
.type-pair{background:#fce4ec;color:#c62828}
.type-cloze{background:#ede7f6;color:#4527a0}
.type-situation{background:#e0f2f1;color:#00695c}
.q-emoji{font-size:4rem;line-height:1;margin-bottom:4px}
.q-sentence{font-size:1.05rem;color:#3d3d6b;font-weight:600;line-height:1.6}
.q-sentence .blank{
  display:inline-block;min-width:80px;border-bottom:3px solid #667eea;
  margin:0 4px;color:#667eea;font-weight:800;
}
.q-spelling{font-size:1.6rem;font-weight:800;letter-spacing:3px;color:#e65100}
.q-situation-box{
  background:#e0f2f1;border-radius:12px;padding:14px;margin-bottom:6px;
  font-size:.92rem;color:#00695c;line-height:1.6;text-align:left;
}
</style>
</head>
<body>


<!-- MENU -->
<div id="screen-menu" class="screen active">
<div class="card">

const weakKey = (g,e) => `weak_${g}_${e}`;

const corrKey = (g,e) => `corr_${g}_${e}`;
const lastKey = (g,e) => `last_${g}_${e}`;

function diffScore(en, g, e) {
  if ((ls.get(weakKey(g,e))[en] || 0) > 0) return 4;
  const s = ls.get(seenKey(g,e))[en] || 0;
  const c = ls.get(corrKey(g,e))[en] || 0;
  if (s < 2)  return 2;
  const acc = c / s;
  if (acc >= 0.8) return 0;
  if (acc >= 0.5) return 1;
  return 3;
}

// ═══════════════════════════════════════════
function makeSpelling(word) {
  const len = word.length;
  if (len <= 2) return word[0] + '_';
  if (len <= 4) {
    const hide = Math.floor(Math.random() * (len - 1)) + 1;
    return word.slice(0, hide) + '_' + word.slice(hide + 1);
  }
  // Hide ~40% of letters
  const indices = [];
  for (let i = 1; i < len; i++) indices.push(i);
  const toHide = shuffle(indices).slice(0, Math.ceil(len * 0.4));
  return word.split('').map((ch, i) => toHide.includes(i) ? '_' : ch).join('');
}

// ═══════════════════════════════════════════
//  GRADE-SPECIFIC QUESTION TYPE POOL
// ═══════════════════════════════════════════
function getTypePool(grade) {
  if (grade <= 2) return shuffle(['emoji','emoji','listening','listening','match']);
  if (grade <= 4) return shuffle(['spelling','spelling','pair','pair','listening']);
  return shuffle(['cloze','cloze','situation','situation','listening']);
}

function buildQuestions(g, e, count) {
  const pool  = [...WORDS[g][e]];
  const weak  = ls.get(weakKey(g,e));
  const seen  = ls.get(seenKey(g,e));
  const last  = ls.get(lastKey(g,e), []);

  const isWeak   = w => (weak[w[0]] || 0) > 0;
  const isUnseen = w => !(seen[w[0]]);
  const isRecent = w => last.includes(w[0]);

  const weakPool   = shuffle(pool.filter(w =>  isWeak(w)));
  const unseenPool = shuffle(pool.filter(w => !isWeak(w) && isUnseen(w)));
  const freshPool  = shuffle(pool.filter(w => !isWeak(w) && !isUnseen(w) && !isRecent(w)));
  const recentPool = shuffle(pool.filter(w => !isWeak(w) && !isUnseen(w) &&  isRecent(w)));

  let qs = [];

  if (count === 20) {
    const k = Math.min(weakPool.length, 10);
    const m = 20 - 2 * k;
    const wgt = getTypePool(g);
    weakPool.slice(0, k).forEach((w, wi) => {
      qs.push({ word:w, type: wgt[wi % wgt.length], isWeak:true });
      qs.push({ word:w, type:'listening', isWeak:true });
    });
    const fillPriority = [...unseenPool, ...freshPool, ...recentPool];
    const gradeTypes = getTypePool(g);
    const typePool = [];
    for (let ti = 0; ti < m; ti++) typePool.push(gradeTypes[ti % gradeTypes.length]);
    shuffle(typePool);
    fillPriority.slice(0, m).forEach((w, i) => {
      qs.push({ word:w, type: typePool[i] || 'reading', isWeak:false });
    });
  } else {
    const gt = getTypePool(g);
    pool.forEach((w, wi) => {
      const iw = isWeak(w);
      qs.push({ word:w, type: gt[wi % gt.length], isWeak:iw });
      qs.push({ word:w, type:'listening', isWeak:iw });
    });
  }

  const scored = qs.map(q => ({ ...q, ds: diffScore(q.word[0], g, e) }));
  const jitter = () => Math.random() * 0.8;
  scored.sort((a, b) => (a.ds + jitter()) - (b.ds + jitter()));
  return scored;
}

function finalizeQuiz(g, e, wrongSet, correctSet) {
  const weak = ls.get(weakKey(g,e));
  wrongSet.forEach(en => { weak[en] = (weak[en]||0) + 1; });
  correctSet.forEach(en => {
    if (weak[en]) { weak[en]--; if (weak[en] <= 0) delete weak[en]; }
  });
  ls.set(weakKey(g,e), weak);

  const seenObj = ls.get(seenKey(g,e));
  const corrObj = ls.get(corrKey(g,e));
  const allWords = new Set([...wrongSet, ...correctSet]);
  allWords.forEach(en => { seenObj[en] = (seenObj[en]||0) + 1; });
  correctSet.forEach(en => { corrObj[en] = (corrObj[en]||0) + 1; });
  ls.set(seenKey(g,e), seenObj);
  ls.set(corrKey(g,e), corrObj);
  ls.set(lastKey(g,e), [...allWords]);
}

function startCountdown() {
  clearCountdown();
  cdAnswered = false;
  cdStart    = Date.now();
  const barEl = document.getElementById('cd-bar');
  const numEl = document.getElementById('cd-num');
  barEl.style.width = '100%';
  barEl.style.background = '#43e97b';
  numEl.textContent = '10';
  numEl.className = 'cd-num';

  cdTimer = setInterval(() => {
    const elapsed   = Date.now() - cdStart;
    const remaining = Math.max(0, CD_TOTAL - elapsed);
    const pct       = (remaining / CD_TOTAL) * 100;
    const secs      = Math.ceil(remaining / 1000);
    barEl.style.width = pct + '%';
    numEl.textContent = secs;
    if (pct <= 30) { barEl.style.background = '#ff6b6b'; numEl.className = 'cd-num urgent'; }
    else if (pct <= 60) { barEl.style.background = '#f6d365'; numEl.className = 'cd-num warn'; }
    else { barEl.style.background = '#43e97b'; numEl.className = 'cd-num'; }
    if (remaining <= 0) { clearCountdown(); if (!cdAnswered) handleTimeout(); }
  }, CD_TICK);
}
function clearCountdown() {
  clearInterval(cdTimer); clearTimeout(cdAutoTimer);
  cdTimer = null; cdAutoTimer = null;
}
function handleTimeout() {
  cdAnswered = true;
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  const btns   = document.querySelectorAll('.opt-btn');
  const labels = ['A','B','C','D'];

  wrongReview.push({

  });

    document.getElementById('q-word').innerHTML = `<span class="q-emoji">${em}</span> 🔊`;
    spkBtn.style.display = 'flex';

    correctIdx = opts.indexOf(word);
    optDisplay = opts.map(o => o[1]);

  } else if (type === 'spelling') {
    // 拼寫填空: show Chinese + partial English, pick complete English
    const partial = makeSpelling(word[0]);
    document.getElementById('q-label').textContent = '看中文和提示，選出正確的完整拼寫';
    document.getElementById('q-word').innerHTML = `${word[1]}<br><span class="q-spelling">${partial}</span>`;

    document.getElementById('q-word').textContent = word[0];

function selectAnswer(chosen, correct, opts, type, word) {
  if (cdAnswered) return;
  cdAnswered = true;
  clearCountdown();
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  const labels=['A','B','C','D'];
  const fb   = document.getElementById('q-fb');
  const btns = document.querySelectorAll('.opt-btn');

  // Build correct answer display based on type
  const ansTypes = ['listening','match'];
  const ans = ansTypes.includes(type) ? `${word[1]}（${word[0]}）` : `${word[0]}（${word[1]}）`;

  // Type label for review
  const TYPE_ICONS = {emoji:'🖼️',match:'🔗',spelling:'✍️',pair:'🔄',cloze:'📝',situation:'💡',listening:'🎧',reading:'📖'};
  const tIcon = TYPE_ICONS[type] || '📖';

  if (chosen===correct) {
    score += 5;
    btns[chosen].classList.add('correct');
    fb.className = 'feedback correct';
    fb.textContent = '✔ 答對了！+5 分';
    speak(word[0],1);
    if (!wrongEnSet.has(word[0])) corrEnSet.add(word[0]);
  } else {
    btns[chosen].classList.add('wrong');
    btns[correct].classList.add('reveal');
    fb.className = 'feedback wrong';
    fb.textContent = `✘ 答錯了！正確答案是 ${labels[correct]}：${ans}`;
    wrongReview.push({
      qLabel  : `${tIcon} ${word[1]}`,
      correct : word[0],
      wordEn  : word[0],
    });
    wrongEnSet.add(word[0]);
    corrEnSet.delete(word[0]);
    speak(word[0],1);
  }
  document.getElementById('q-score').textContent = `${score} 分`;
  document.getElementById('q-next').classList.add('visible');
}

  document.getElementById('r-max').textContent   = `/ ${maxScore}`;
  document.getElementById('r-time').textContent  = formatSecs(quizTotalSecs);
  document.getElementById('r-c').textContent     = totalQ - wrongReview.length;
  document.getElementById('r-w').textContent     = wrongReview.length;
  const [t, s] = getEncouragement(selName, pct);

  if (pct >= 60) launchConfetti(pct);

  const rSec = document.getElementById('r-review-sec');

  if (wrongReview.length===0) { rSec.style.display='none'; }
  else {
    rSec.style.display='';

    const seen = new Set();
    rDiv.innerHTML = wrongReview
      .filter(w => { if(seen.has(w.wordEn)) return false; seen.add(w.wordEn); return true; })
      .map(w=>`<div class="wrong-item"><span class="wi-q">${w.qLabel}</span><span class="wi-a">✔ ${w.correct}</span></div>`)
      .join('');
  }

  const wSec = document.getElementById('r-weak-sec');
  const wTags = document.getElementById('r-weak-tags');
  const weakNow = ls.get(weakKey(selGrade,selExam));
  const weakEntries = Object.entries(weakNow).sort((a,b)=>b[1]-a[1]);
  if (weakEntries.length===0) { wSec.style.display='none'; }
  else {
    wSec.style.display='';

    const enToZh = Object.fromEntries(allW.map(w=>[w[0],w[1]]));

      <div class="weak-tag">
        <span class="wt-cnt">${cnt}</span>
        ${en} <span style="color:#bbb;font-weight:400">${enToZh[en]||''}</span>
      </div>`).join('');
  }
}

const HISTORY_KEY = 'quiz_history';
const TEN_YEARS_MS = 10 * 365.25 * 24 * 60 * 60 * 1000;

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}
function saveHistory(records) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(records));
}
function cleanOldHistory() {
  const cutoff = Date.now() - TEN_YEARS_MS;
  const records = getHistory().filter(r => r.ts >= cutoff);
  saveHistory(records);
  return records;
}
function addRecord(name, grade, exam, count, score, maxScore, totalSecs) {
  const records = cleanOldHistory();
  records.push({
    ts: Date.now(),
    name: name,
    grade: grade,
    exam: exam,
    count: count,
    score: score,
    maxScore: maxScore,
    pct: Math.round(score / maxScore * 100),
    totalSecs: totalSecs || 0,
  });
  saveHistory(records);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDate(ts) {
  const d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate();
}
function formatDateTime(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function getTodayRecords() {
  const today = todayStr();
  return getHistory().filter(r => {
    const d = new Date(r.ts);
    const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    return ds === today;
  });
}

function formatSecs(s) {
  if (!s && s !== 0) return '';
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m > 0 ? `${m}分${sec}秒` : `${sec}秒`;
}
function renderLeaderboard(targetId) {
  const todayRecs = getTodayRecords();
  const countEl = document.getElementById('lb-today-count');
  if (countEl) countEl.textContent = todayRecs.length > 0 ? `今日已練習 ${todayRecs.length} 次` : '';

  const podium = document.getElementById(targetId || 'lb-podium');
  if (!podium) return;

  if (todayRecs.length === 0) {
    podium.innerHTML = '<div class="lb-empty">今天還沒有人作答喔，快來挑戰吧！</div>';
    return;
  }

  const avatarMap2 = {
    '嘉駿(Jackson)':'🦁', '振凱(Max)':'🐯',
    '煊煊':'🐻', '芳芳':'🐰',
    '軒寶':'🐨', '恆恆':'🦅'
  };

  // Sort by pct desc, then by totalSecs asc (faster is better), then by ts asc
  const sorted = [...todayRecs].sort((a, b) => {
    if (b.pct !== a.pct) return b.pct - a.pct;
    const aSecs = a.totalSecs || 9999;
    const bSecs = b.totalSecs || 9999;
    if (aSecs !== bSecs) return aSecs - bSecs;
    return a.ts - b.ts;
  });

  const top10 = sorted.slice(0, 10);
  const medals = ['🥇', '🥈', '🥉'];
  const examNames = { midterm: '期中', final: '期末' };

  podium.innerHTML = top10.map((r, i) => {
    const avatar = avatarMap2[r.name] || '😊';
    const displayName = r.name.replace(/\(.*\)/,'');
    const time = new Date(r.ts);
    const timeStr = String(time.getHours()).padStart(2,'0') + ':' + String(time.getMinutes()).padStart(2,'0');
    const secsStr = r.totalSecs ? ` ・ 用時 ${formatSecs(r.totalSecs)}` : '';
    const rankClass = i < 3 ? `rank-${i+1}` : 'rank-other';
    const rankLabel = i < 3 ? `<span class="lb-rank">${medals[i]}</span>` : `<span class="lb-rank-num">${i+1}</span>`;
    return `<div class="lb-row ${rankClass}">
      ${rankLabel}
      <div class="lb-info">
        <div class="lb-name">${avatar} ${displayName}</div>
        <div class="lb-detail">${r.grade}年級 ${examNames[r.exam]||r.exam} ${r.count}題 ・ ${timeStr}${secsStr}</div>
      </div>
      <div style="text-align:right">
        <div class="lb-score-val">${r.score}分</div>
        <div class="lb-pct">${r.pct}%</div>
      </div>
    </div>`;
  }).join('');
}

  title.textContent = `📌 ${displayName} 的常錯題目`;

  let html = '';
  let totalWeak = 0;
  for (let g = 2; g <= 6; g++) {
    let gradeItems = [];
    ['midterm','final'].forEach(e => {
      const weak = ls.get(weakKey(g,e));
      const allW = [...(WORDS[g]?.[e] || [])];
      const enToZh = Object.fromEntries(allW.map(w=>[w[0],w[1]]));
      Object.entries(weak).sort((a,b)=>b[1]-a[1]).forEach(([en, cnt]) => {
        gradeItems.push({ en, zh: enToZh[en]||'', cnt });
      });
    });
    if (gradeItems.length > 0) {
      totalWeak += gradeItems.length;
      html += `<div class="weak-panel-grade">
        <div class="weak-panel-grade-title">${g} 年級（${gradeItems.length} 個）</div>`;
      html += gradeItems.map(w =>
        `<div class="weak-word-item" onclick="speak('${w.en}',2)">
          <span class="weak-word-en">${w.en}</span>
          <span class="weak-word-zh">${w.zh}</span>
          <span class="weak-word-cnt">錯 ${w.cnt} 次</span>
        </div>`).join('');
      html += '</div>';
    }
  }
  if (totalWeak === 0) {
    list.innerHTML = '<div class="weak-panel-empty">太棒了！目前沒有常錯的題目 🎉</div>';
  } else {
    list.innerHTML = html;
  }
}

let currentWord = null;
function speak(text, times=3) {
  currentWord = text;
  const spkBtn = document.getElementById('speak-btn');
  if (spkBtn) spkBtn.classList.add('playing');
  let count = 0;
  function go() {
    if (count >= times) { if (spkBtn) spkBtn.classList.remove('playing'); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = () => { count++; setTimeout(go, 400); };
    u.onerror = () => { if (spkBtn) spkBtn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  }
  speechSynthesis.cancel(); go();
}
function replayWord(){if(currentWord)speak(currentWord);}

function shuffle(a){
  const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;
}

  const perfectCount = filtered.filter(r => r.pct === 100).length;
  summary.innerHTML = `
    <div class="hist-stat"><div class="hist-stat-num">${totalPractice}</div><div class="hist-stat-lbl">總練習次數</div></div>
    <div class="hist-stat"><div class="hist-stat-num">${avgPct}%</div><div class="hist-stat-lbl">平均正確率</div></div>
    <div class="hist-stat"><div class="hist-stat-num">${perfectCount}</div><div class="hist-stat-lbl">滿分次數</div></div>
  `;

  // List (newest first, max 100)
  const list = document.getElementById('hist-list');
  const show = [...filtered].reverse().slice(0, 100);
  const examNames = { midterm: '期中', final: '期末' };

  if (show.length === 0) {
    list.innerHTML = '<div class="lb-empty">還沒有紀錄</div>';
    return;
  }

  list.innerHTML = show.map(r => {
    const displayName = r.name.replace(/\(.*\)/,'');
    const avatar = avatarMap2[r.name] || '😊';
    return `<div class="hist-item">
      <span class="hist-date">${formatDateTime(r.ts)}</span>
      <span class="hist-who">${avatar} ${displayName}</span>
      <span class="hist-grade">${r.grade}年${examNames[r.exam]||''}</span>
      <span class="hist-sc">${r.score}/${r.maxScore}</span>
      <div class="hist-pct-bar"><div class="hist-pct-fill" style="width:${r.pct}%"></div></div>
    </div>`;
  }).join('');
}

// ── Weak words review panel (global) ──
function updateWeakBtn() {
  const btn = document.getElementById('weak-review-btn');
  if (!btn) return;
  if (!selName) { btn.classList.remove('show'); return; }
  let totalWeak = 0;
  for (let g = 2; g <= 6; g++) {
    ['midterm','final'].forEach(e => {
      totalWeak += Object.keys(ls.get(weakKey(g,e))).length;
    });
  }
  if (totalWeak > 0) {
    btn.textContent = `📌 查看常錯題目（${totalWeak} 個）`;
    btn.classList.add('show');
  } else {
    btn.classList.remove('show');
  }
}
function toggleWeakPanel() {
  const panel = document.getElementById('weak-panel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) renderWeakPanel();
}
function renderWeakPanel() {
  const title = document.getElementById('weak-panel-title');
  const list = document.getElementById('weak-panel-list');
  const displayName = selName ? selName.replace(/\(.*\)/,'') : '';
  title.textContent = `📌 ${displayName} 的常錯題目`;

  let html = '';
  let totalWeak = 0;
  for (let g = 2; g <= 6; g++) {
    let gradeItems = [];
    ['midterm','final'].forEach(e => {
      const weak = ls.get(weakKey(g,e));
      const allW = [...(WORDS[g]?.[e] || [])];
      const enToZh = Object.fromEntries(allW.map(w=>[w[0],w[1]]));
      Object.entries(weak).sort((a,b)=>b[1]-a[1]).forEach(([en, cnt]) => {
        gradeItems.push({ en, zh: enToZh[en]||'', cnt });
      });
    });
    if (gradeItems.length > 0) {
      totalWeak += gradeItems.length;
      html += `<div class="weak-panel-grade">
        <div class="weak-panel-grade-title">${g} 年級（${gradeItems.length} 個）</div>`;
      html += gradeItems.map(w =>
        `<div class="weak-word-item" onclick="speak('${w.en}',2)">
          <span class="weak-word-en">${w.en}</span>
          <span class="weak-word-zh">${w.zh}</span>
          <span class="weak-word-cnt">錯 ${w.cnt} 次</span>
        </div>`).join('');
      html += '</div>';
    }
  }
  if (totalWeak === 0) {
    list.innerHTML = '<div class="weak-panel-empty">太棒了！目前沒有常錯的題目 🎉</div>';
  } else {
    list.innerHTML = html;
  }
}

initWeakDots();
renderLeaderboard('lb-podium');
updateWeakBtn();
</script>
